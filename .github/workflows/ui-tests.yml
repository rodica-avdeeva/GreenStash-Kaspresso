name: UI Tests on Emulator (Kaspresso)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  kaspresso-instrumentation-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Install emulator and system image
        run: |
          sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3" \
                     "system-images;android-30;google_apis;x86_64" "emulator"

      - name: Create AVD
        run: |
          echo "no" | avdmanager create avd -n test -k "system-images;android-30;google_apis;x86_64" --device "pixel"

      - name: Start emulator
        run: |
          emulator -avd test -no-audio -no-window -no-boot-anim -gpu swiftshader &
          adb wait-for-device
          adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done;'
          adb shell input keyevent 82 # разблокировка

      - name: Grant Gradle permissions
        run: chmod +x ./gradlew

      - name: Run Kaspresso tests
        run: ./gradlew connectedDebugAndroidTest

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: app/build/outputs/allure-results
