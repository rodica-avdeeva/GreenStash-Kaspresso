name: Android UI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

            - name: Android Emulator
  # You may pin to the exact commit or the version.
  # uses: vgaidarji/android-github-actions-emulator@30c50f42518922e01004c2152911bb458d33ff3b
  uses: vgaidarji/android-github-actions-emulator@v1.0.1
          

      - name: Run UI tests
        run: ./gradlew connectedDebugAndroidTest

      - name: Pull Allure results from device
        run: ./gradlew pullAllureResults

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: app/build/allure-results
