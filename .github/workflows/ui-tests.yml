name: UI Tests on Emulator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  instrumentation-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3" "system-images;android-30;google_apis;x86_64" "emulator"

      - name: Create and start Android emulator
        run: |
          echo "no" | avdmanager create avd -n test -k "system-images;android-30;google_apis;x86_64" --device "pixel"
          export PATH=$PATH:$ANDROID_HOME/emulator
          emulator -avd test -no-window -no-audio -gpu off &
          adb wait-for-device
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82 &

      - name: Grant Gradle permissions
        run: chmod +x ./gradlew

      - name: Run instrumentation tests
        run: ./gradlew connectedDebugAndroidTest

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: app/build/outputs/allure-results
