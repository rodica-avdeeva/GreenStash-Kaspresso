name: Android UI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  JAVA_VERSION: '17'
  ANDROID_API_LEVEL: 31
  ANDROID_TARGET: google_apis
  ANDROID_ARCH: x86_64
  ANDROID_PROFILE: pixel
  ARTIFACT_NAME: allure-results
  MARATHON_VERSION: '0.10.4'
  MARATHON_URL: https://github.com/MarathonLabs/marathon/releases/download/0.10.4/marathon-0.10.4.zip

defaults:
  run:
    shell: bash

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-overwrite-existing: true
          gradle-home-cache-cleanup: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APKs
        run: ./gradlew assembleDebug assembleAndroidTest

      - name: Download Marathon CLI
        run: |
          wget ${{ env.MARATHON_URL }} -O marathon.zip
          unzip marathon.zip -d marathon-cli

      - name: Run UI tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          arch: ${{ env.ANDROID_ARCH }}
          profile: ${{ env.ANDROID_PROFILE }}
          script: |
            export ANDROID_SDK_ROOT=$ANDROID_HOME
            ./marathon-cli/marathon-${{ env.MARATHON_VERSION }}/bin/marathon -m Marathonfile run || echo "UI tests failed"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/reports/marathon/device-files/allure-results

  deploy-allure-report:
    if: always()
    name: Generate and Deploy Allure Report
    needs: [ui-tests]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Download Allure results
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/reports/marathon/device-files/allure-results

      - name: Generate Allure HTML Report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: build/reports/marathon/device-files/allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v2
        env:
          PERSONAL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_BRANCH: gh-pages
          PUBLISH_DIR: allure-history
